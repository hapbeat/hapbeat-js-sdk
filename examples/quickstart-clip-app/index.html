<!doctype html>
<!--
  Quick start in your own app folder: after `npm install @hapbeat/sdk`, put
  this file and hit_80hz.wav in the folder, serve it with any static server
  (e.g. `npx serve`) and open it. One button streams the WAV through
  hapbeat-helper (running on this PC) to every Hapbeat on the LAN. No kit.
  With a bundler (Vite etc.), drop the importmap.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hapbeat quick start (clip)</title>
    <script type="importmap">
      { "imports": { "@hapbeat/sdk": "./node_modules/@hapbeat/sdk/dist/browser.js" } }
    </script>
  </head>
  <body>
    <button id="hit" disabled>Hit</button>
    <pre id="log"></pre>
    <script type="module">
      import { connect } from "@hapbeat/sdk";
      const log = (m) => (document.getElementById("log").textContent += m + "\n");

      try {
        const hb = await connect({ appName: "QuickStart" });

        const button = document.getElementById("hit");
        button.onclick = () =>
          hb.playClipUrl("./hit_80hz.wav", { gain: 0.6 }).catch((e) => log("ERROR: " + e.message)); // <- the one line
        button.disabled = false;
        log("connected to hapbeat-helper");
      } catch (e) {
        log("ERROR: " + e.message);
      }
    </script>
  </body>
</html>
