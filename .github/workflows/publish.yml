name: Publish to npm

# Publishes @hapbeat/sdk on a version tag. Runs the test suite as a gate, then
# builds dist/ and publishes. Uses an npm automation token stored as the repo
# secret NPM_TOKEN.
#
# One-time setup (do once, BEFORE the first tag):
#   1. Create the @hapbeat scope/org on npm (free for public packages), or
#      switch the package name to unscoped "hapbeat" (also free as of 2026-06-01).
#   2. Create an npm "Automation" access token and add it to this repo:
#      Settings -> Secrets and variables -> Actions -> New secret: NPM_TOKEN.
#   3. (Optional) Once the GitHub repo is PUBLIC, add `--provenance` to the
#      publish step for supply-chain attestation (provenance needs a public repo).
#
# DO NOT tag until the SDK is verified on a real Hapbeat device (Node path) and,
# for the browser transport, against a running hapbeat-helper.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # reserved for --provenance once the repo is public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Build + test (publish gate)
        run: |
          npm run build
          node --test
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 公開直後に devtools-site の release feed を再生成させる (DEC-053)。
      # feed は「実際に npm に上がっている版」を載せる仕様なので、publish の
      # *後* でなければ意味がない。registry 反映に少し間があるので待ってから叩く。
      # 取り逃しても次の devtools-site ビルドで拾えるため best-effort。
      - name: Notify devtools-site (release feed)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DOCS_SITE_DISPATCH_TOKEN is not set; skipping dispatch."
            exit 0
          fi
          sleep 60
          gh api repos/Hapbeat/hapbeat-devtools-site/dispatches \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -f event_type=release-published \
            -f "client_payload[source_repo]=${{ github.repository }}" \
            -f "client_payload[ref]=${{ github.ref_name }}"
