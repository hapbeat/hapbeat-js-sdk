name: Publish to npm

# Publishes @hapbeat/sdk on a version tag. Runs the test suite as a gate, then
# builds dist/ and publishes with npm Trusted Publishing (OIDC): no token, and
# provenance is generated automatically for this public repo and public package.
#
# One-time setup on npmjs.com, at most 2 days before the first tag (a new
# configuration expires unless it completes a successful publish within 2 days):
#   @hapbeat/sdk -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user: hapbeat
#     Repository:           hapbeat-js-sdk
#     Workflow filename:    publish.yml
#     Environment name:     (empty)
#     Allowed actions:      include `npm publish`
#   All fields are case-sensitive. npm does not check them when you save; a wrong
#   value only shows as a failed publish. package.json repository.url must match.
# https://docs.npmjs.com/trusted-publishers
#
# DO NOT tag until the SDK is verified on a real Hapbeat device (Node path) and,
# for the browser transport, against a running hapbeat-helper.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Build + test (publish gate)
        run: |
          npm run build
          node --test
      # Trusted Publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - name: Update npm
        run: npm install -g npm@11
      - name: Publish
        run: npm publish --access public

      # 公開直後に devtools-site の release feed を再生成させる (DEC-053)。
      # feed は「実際に npm に上がっている版」を載せる仕様なので、publish の
      # *後* でなければ意味がない。registry 反映に少し間があるので待ってから叩く。
      # 取り逃しても次の devtools-site ビルドで拾えるため best-effort。
      - name: Notify devtools-site (release feed)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DOCS_SITE_DISPATCH_TOKEN is not set; skipping dispatch."
            exit 0
          fi
          sleep 60
          gh api repos/Hapbeat/hapbeat-devtools-site/dispatches \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -f event_type=release-published \
            -f "client_payload[source_repo]=${{ github.repository }}" \
            -f "client_payload[ref]=${{ github.ref_name }}"
